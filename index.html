<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dompet Mochi - Catatan Uang Lucu</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="mochi">🍡</div>
    <h1>Dompet Mochi</h1>
    <p>Catat uang masuk dan keluar biar dompetmu nggak ngambek.</p>
  </header>

  <section class="summary">
    <div class="stat in"><small>Total pemasukan</small><div class="big" id="sIn">Rp0</div></div>
    <div class="stat out"><small>Total pengeluaran</small><div class="big" id="sOut">Rp0</div></div>
    <div class="stat left"><small>Sisa uang</small><div class="big" id="sLeft">Rp0</div></div>
  </section>

  <section class="grid">
    <form class="card" id="formIn" autocomplete="off">
      <h2>🐷 Tambah pemasukan</h2>
      <label for="inSrc">Sumber / dompet</label>
      <select id="inSrc">
        <option>Cash</option><option>Bank Mandiri</option><option>Bank BCA</option><option>Bank BRI</option>
        <option>ShopeePay</option><option>GoPay</option><option>OVO</option><option>DANA</option>
        <option>Freelance</option><option>Gaji</option><option>Lainnya</option>
      </select>
      <label for="inAmt">Jumlah (Rp)</label>
      <input id="inAmt" type="number" min="1" inputmode="numeric" placeholder="contoh: 500000" required>
      <label for="inNote">Catatan (opsional)</label>
      <input id="inNote" type="text" maxlength="60" placeholder="contoh: Proyek logo">
      <label for="inDate">Tanggal</label>
      <input id="inDate" type="date" required>
      <button class="btn-in" type="submit">Simpan pemasukan 💰</button>
    </form>

    <form class="card" id="formOut" autocomplete="off">
      <h2>🐙 Tambah pengeluaran</h2>
      <label for="outSrc">Pakai uang dari</label>
      <select id="outSrc"></select>
      <label for="outAmt">Jumlah (Rp)</label>
      <input id="outAmt" type="number" min="1" inputmode="numeric" placeholder="contoh: 25000" required>
      <label for="outCat">Kategori</label>
      <select id="outCat">
        <option>🍜 Makanan</option><option>🚌 Transportasi</option><option>🛍️ Belanja</option>
        <option>🎮 Hiburan</option><option>📚 Pendidikan</option><option>💡 Tagihan</option><option>🎁 Lainnya</option>
      </select>
      <label for="outDate">Tanggal</label>
      <input id="outDate" type="date" required>
      <div class="hint" id="outHint">Sisa di dompet ini: Rp0</div>
      <button class="btn-out" type="submit">Simpan pengeluaran 💸</button>
    </form>
  </section>

  <section class="card list">
    <h2>👛 Sisa per dompet</h2>
    <div class="wallets" id="wallets"></div>
  </section>

  <section class="card list">
    <div class="toolbar">
      <h2 style="margin:0">📒 Riwayat transaksi</h2>
      <div>
        <button class="btn-xl" id="btnXlsx" type="button">⬇️ Download Excel</button>
        <button class="btn-clear" id="btnClear" type="button">🗑️ Hapus semua</button>
      </div>
    </div>
    <div id="history"></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="script.js"></script>
</body>
</html>
